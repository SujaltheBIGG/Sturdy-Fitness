name: Build Mobile APK & Release

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes'
        required: false
        default: 'New build'

  # Auto-trigger on mobile version tags (e.g. mobile-v1.0.0)
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: write

# Cancel an in-progress build if a newer one starts for the same ref
concurrency:
  group: build-mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [ci]
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies & build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          # android/ no existe en el checkout (lo genera prebuild), así que
          # hasheamos lo que SÍ define el grafo nativo: lockfile + config Expo.
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json', 'apps/mobile/package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env file
        working-directory: apps/mobile
        run: |
          cat <<'DOTENV' > .env
          EXPO_PUBLIC_PB_URL=${{ vars.EXPO_PUBLIC_PB_URL }}
          EXPO_PUBLIC_AI_API_URL=${{ vars.EXPO_PUBLIC_AI_API_URL }}
          EXPO_PUBLIC_OPENPANEL_CLIENT_ID=${{ vars.EXPO_PUBLIC_OPENPANEL_CLIENT_ID }}
          EXPO_PUBLIC_OPENPANEL_CLIENT_SECRET=${{ secrets.EXPO_PUBLIC_OPENPANEL_CLIENT_SECRET }}
          EXPO_PUBLIC_SENTRY_DSN=${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          DOTENV

      - name: Create google-services.json
        # Android FCM config, consumed by `expo prebuild`
        # (android.googleServicesFile). The repo carries a placeholder so the
        # build is self-contained; set the GOOGLE_SERVICES_JSON secret to a real
        # Firebase config to override it and make push actually deliver:
        #   gh secret set GOOGLE_SERVICES_JSON < apps/mobile/google-services.json
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "Wrote google-services.json from secret ($(wc -c < google-services.json) bytes)"
          elif [ -f google-services.json ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret not set; using the placeholder committed in the repo. Push notifications will not deliver until a real Firebase config is supplied."
          else
            echo "::error::No google-services.json in the repo and no GOOGLE_SERVICES_JSON secret set."
            exit 1
          fi

      - name: Generate Android native project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean

      - name: Configure release signing
        # Stable release keystore so sideloaded updates install over a previous
        # version (Android keys app identity by package + signing cert). Runs
        # AFTER prebuild because --clean wipes android/.
        #
        # This step used to "warn and continue" when the secret was missing, on
        # the assumption that Expo points buildTypes.release at the debug
        # signingConfig. It does not: the result was a completely unsigned APK
        # that Android refuses to install ("There was a problem while parsing
        # the package"). An unsigned APK is worthless, so this now fails loudly.
        #
        # The keystore is PKCS12 (storeType below), which is what both keytool
        # (JDK 9+ default) and openssl produce.
        working-directory: apps/mobile/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Without it the APK builds unsigned and cannot be installed. Set ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "Wrote release.keystore ($(wc -c < release.keystore) bytes)"
          node - <<'NODE'
          const fs = require('fs');
          const p = 'build.gradle';
          let s = fs.readFileSync(p, 'utf8');

          // Insert the release signingConfig if it isn't there yet.
          if (!s.includes('signingConfigs.release')) {
            if (!/signingConfigs\s*\{/.test(s)) {
              console.error('::error::no signingConfigs block in build.gradle');
              process.exit(1);
            }
            const block = [
              'signingConfigs {',
              '    release {',
              "        storeFile file('release.keystore')",
              "        storeType 'PKCS12'",
              "        storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')",
              "        keyAlias System.getenv('ANDROID_KEY_ALIAS')",
              "        keyPassword System.getenv('ANDROID_KEY_PASSWORD')",
              '    }',
            ].join('\n');
            s = s.replace(/signingConfigs\s*\{/, block);
          }

          // Locate buildTypes { ... } by brace matching, then the release
          // sub-block inside it. Regex alone is not safe here: a lazy match for
          // "release {" also hits the release entry inside signingConfigs and
          // silently rewrites the wrong signingConfig line, leaving the release
          // build on the debug key.
          function blockAfter(src, headRe, from) {
            const m = src.slice(from).match(headRe);
            if (!m) return null;
            const headAt = from + m.index;
            const open = src.indexOf('{', headAt);
            if (open < 0) return null;
            let depth = 0;
            for (let i = open; i < src.length; i++) {
              if (src[i] === '{') depth++;
              else if (src[i] === '}') { depth--; if (depth === 0) return { open, close: i }; }
            }
            return null;
          }

          const bt = blockAfter(s, /\bbuildTypes\s*\{/, 0);
          if (!bt) { console.error('::error::no buildTypes block'); process.exit(1); }
          const rel = blockAfter(s, /\brelease\s*\{/, bt.open);
          if (!rel || rel.close > bt.close) { console.error('::error::no release buildType'); process.exit(1); }

          let body = s.slice(rel.open + 1, rel.close);
          if (/signingConfig\s+signingConfigs\.\w+/.test(body)) {
            body = body.replace(/signingConfig\s+signingConfigs\.\w+/, 'signingConfig signingConfigs.release');
          } else {
            body = '\n            signingConfig signingConfigs.release' + body;
          }
          s = s.slice(0, rel.open + 1) + body + s.slice(rel.close);

          // Re-verify against the rewritten source, scoped to buildTypes.release.
          const bt2 = blockAfter(s, /\bbuildTypes\s*\{/, 0);
          const rel2 = blockAfter(s, /\brelease\s*\{/, bt2.open);
          if (!/signingConfig\s+signingConfigs\.release/.test(s.slice(rel2.open, rel2.close))) {
            console.error('::error::release buildType is not using signingConfigs.release');
            process.exit(1);
          }
          fs.writeFileSync(p, s);
          console.log('Patched build.gradle: buildTypes.release -> signingConfigs.release');
          NODE

      - name: Build APK
        working-directory: apps/mobile/android
        # Sentry source maps are uploaded during the release bundle task. The
        # org/project come from android/sentry.properties (written by the
        # @sentry/react-native expo plugin during prebuild) and the token from
        # SENTRY_AUTH_TOKEN below. @sentry/cli is a direct dep of apps/mobile so
        # its binary resolves cleanly under pnpm.
        #
        # reactNativeArchitectures restricts the native build to real phones
        # (arm64 + 32-bit arm), dropping x86/x86_64 emulator ABIs → ~half the
        # native compile (Hermes + New Arch codegen). The keystore creds are read
        # by the release signingConfig injected in the previous step.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # app.json still carries the placeholder Sentry org ("CLIENT-ORG"),
          # so the release bundle task fails with "Project not found" and takes
          # the whole APK down with it. Source maps are optional; skip the
          # upload until a real Sentry org/project is configured.
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a,armeabi-v7a
        run: ./gradlew assembleRelease --build-cache --parallel -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" -Dorg.gradle.workers.max=4

      - name: Get version info
        id: version
        working-directory: apps/mobile
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          DATE=$(date +'%Y%m%d-%H%M')
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_NAME="mobile-v${VERSION}-build.${DATE}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          APK_PATH=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_PATH" "Sturdy-${{ steps.version.outputs.version }}.apk"

      - name: Verify APK is signed
        # A previous release shipped completely unsigned (no v1 META-INF sig, no
        # v2 signing block) and Android rejected it with "There was a problem
        # while parsing the package". Fail here rather than publish that again.
        run: |
          APK="Sturdy-${{ steps.version.outputs.version }}.apk"
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" > sig.txt || { cat sig.txt; echo "::error::APK signature verification failed"; exit 1; }
            cat sig.txt
            # A debug-signed APK installs, but the debug keystore is regenerated
            # per build, so the next release will not install over it. Treat it
            # as a failure: it means the release signingConfig did not attach.
            if grep -q "CN=Android Debug" sig.txt; then
              echo "::error::APK is signed with the DEBUG key, not the release keystore. buildTypes.release did not pick up signingConfigs.release."
              exit 1
            fi
            echo "apksigner: signed with the release key"
          else
            echo "::warning::apksigner not found; falling back to a structural check"
            if unzip -l "$APK" | grep -qE "META-INF/.*\.(RSA|DSA|EC)$"; then
              echo "v1 signature present"
            elif grep -qa "APK Sig Block 42" "$APK"; then
              echo "v2/v3 signing block present"
            else
              echo "::error::APK is unsigned"; exit 1
            fi
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sturdy-apk
          path: Sturdy-${{ steps.version.outputs.version }}.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      # El checkout va PRIMERO: actions/checkout limpia el workspace y se
      # llevaría por delante el APK descargado.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: sturdy-apk

      # El body salía siempre como 'Automated build' mientras la copia curada
      # (bilingüe, la misma que ven web y móvil en "Novedades") se quedaba en
      # packages/core/data/changelog.mobile.json sin llegar a nadie.
      # extract-changelog-entry.mjs no necesita dependencias: sólo node:fs.
      - name: Compose release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          # Por env, nunca interpolado en el script: en un repo público un
          # ${{ ... }} dentro de `run` es una inyección de shell esperando.
          DISPATCH_NOTES: ${{ github.event.inputs.release_notes }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Sturdy $VERSION"
            echo
            if [ "$IS_DISPATCH" = "true" ]; then
              echo "$DISPATCH_NOTES"
            else
              node scripts/extract-changelog-entry.mjs "$VERSION" \
                || echo "_No changelog entry for $VERSION._"
            fi
            echo
            echo "### Install"
            echo "1. Download the APK file below"
            echo "2. On your Android, enable \"Install unknown apps\" in Settings"
            echo "3. Open the downloaded APK to install"
            echo
            echo "---"
            echo "Built from commit: $COMMIT_SHA"
          } > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: Sturdy ${{ needs.build.outputs.tag_name }}
          body_path: release-notes.md
          files: Sturdy-${{ needs.build.outputs.version }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
